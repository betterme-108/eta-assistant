# =====================================================================
# 初中英语错因本体库 v3（36 类）
# 英语教学助手的核心内容资产——全部技术壁垒所在。
#
# v3 调整（对齐两大任务：课时作业 / 考试试卷）：
#   分组重排：A 词汇知识(6) / B 语法结构(9) / C 语篇理解(8) / D 书面表达(8) / E 答题行为(5)
#   C 组新增完形填空与信息转述两类（考试试卷题型对齐）
#   D 组统一书面表达错因（含中式英语、语用得体）
#   E 组新增审题偏差；粗心 vs 未掌握对照组为 E02/E05
#
# 结构约定：
#   groups      五大组
#   categories  每类含 id / group / name / name_en / signals / examples / teaching_point
#   E 类额外含 rule（结构化判别规则，程序可读）与 contrast_with
#   C / D 类 examples 必须含中英文对照
#   practice_seed：历史遗留字段（早期 mock 题库内置题数），当前代码无引用；
#                 字段保留不动，避免影响解析
#
# 伦理约束（写入 prompt，随库分发）：错因只服务教学决策，不评价学生个人。
# =====================================================================
version: "3.0"

groups:
  - id: A
    name: 词汇知识类
    name_en: Vocabulary Knowledge
    description: 单词拼写、词形变化、词义、搭配与指代层面的词汇错误
  - id: B
    name: 语法结构类
    name_en: Grammar & Structure
    description: 时态、语态、从句、句子成分等语法规则层面的错误
  - id: C
    name: 语篇理解类
    name_en: Discourse Comprehension
    description: 阅读理解、完形填空等语篇题型的理解与线索运用错误
  - id: D
    name: 书面表达类
    name_en: Written Expression
    description: 书面表达的内容、文体、连贯与语用得体问题（含中式英语专项）
  - id: E
    name: 答题行为类
    name_en: Test-taking Behavior
    description: 跨题型的非知识性错误——基于频次与班级基准的交叉判别（粗心 vs 未掌握）

categories:
  # ================= A 词汇知识类（6） =================
  - id: A01
    group: A
    name: 拼写与形近词
    name_en: spelling & confusables
    signals:
      - quite/quiet、form/from 等形近词互串
      - 高频词拼写错误
      - 大小写与单词边界问题
    examples:
      - wrong: "The classroom is quite in the exam."
        right: "The classroom is quiet in the exam."
      - wrong: "I received a letter form my pen friend."
        right: "I received a letter from my pen friend."
    teaching_point: "形近词成对对比记忆（quite 相当 / quiet 安静；form 表格 / from 来自）；誊写后通读查拼写"
    practice_seed: 3

  - id: A02
    group: A
    name: 词形变化
    name_en: word forms
    signals:
      - 动词时态形式变化错误（过去式/过去分词误变）
      - 名词复数形式错误（规则与不规则）
      - 形容词/副词级的形式变化错误
    examples:
      - wrong: "He writed a letter to his pen pal."
        right: "He wrote a letter to his pen pal."
        note: write 是不规则动词，过去式应为 wrote
      - wrong: "There are many sheeps on the farm."
        right: "There are many sheep on the farm."
    teaching_point: "不规则动词表、不规则名词复数按组记忆；规则变化注意 y 变 i、双写辅音等细则"
    practice_seed: 3

  - id: A03
    group: A
    name: 词义辨析
    name_en: word meaning discrimination
    signals:
      - say/speak/tell/talk 混用
      - borrow/lend 混用
      - 其他高频近义动词/介词误选
    examples:
      - wrong: "He said me a story last night."
        right: "He told me a story last night."
        note: tell a story 是固定搭配
      - wrong: "I borrowed my bike to him."
        right: "I lent my bike to him."
    teaching_point: "say 强调内容、speak 强调能力/语言、tell 强调讲述对象、talk 强调交谈；borrow 借入、lend 借出"
    practice_seed: 3

  - id: A04
    group: A
    name: 固定搭配与短语
    name_en: collocations & phrases
    signals:
      - listen the music 类介词缺失
      - in Sunday 类时间介词误用
      - 动词短语/形容词搭配介词错误
    examples:
      - wrong: "We listen the music in class."
        right: "We listen to the music in class."
      - wrong: "I will visit my grandma in Sunday."
        right: "I will visit my grandma on Sunday."
    teaching_point: "时间介词口诀：at 时刻、on 具体某天、in 年月时段；listen to / arrive at(in) 等搭配整体记"
    practice_seed: 3

  - id: A05
    group: A
    name: 冠词与限定词
    name_en: articles & determiners
    signals:
      - a/an 误用
      - 定冠词与零冠词错误（专有名词、习惯用语）
      - some/any/many/much 等限定词误选
    examples:
      - wrong: "He is a honest boy."
        right: "He is an honest boy."
        note: honest 的 h 不发音，以元音音素开头用 an
      - wrong: "My father bought me a useful book last week."
        right: "My father bought me a useful book last week."
        note: useful 以辅音音素 /j/ 开头，用 a 正确；常见错误是看到元音字母 u 就选 an
    teaching_point: "a/an 看音标不看字母；零冠词场合清单化（球类/三餐/学科）；限定词与名词可数性匹配"
    practice_seed: 3

  - id: A06
    group: A
    name: 代词与指代
    name_en: pronouns & reference
    signals:
      - 人称/物主/反身代词混用
      - 主格与宾格误用
      - 指代对象不清或前后不一致
    examples:
      - wrong: "Between you and I, this is a secret."
        right: "Between you and me, this is a secret."
        note: 介词后用宾格
      - wrong: "Tom hurt him when he fell off the bike."
        right: "Tom hurt himself when he fell off the bike."
    teaching_point: "动作返回主语自身用反身代词；介词/动词后用宾格；写作中指代必须明确唯一"
    practice_seed: 3

  # ================= B 语法结构类（9） =================
  - id: B01
    group: B
    name: 时态误用
    name_en: tense misuse
    signals:
      - 时间状语与动词形式不匹配
      - 现在完成时与一般过去时混淆
      - 条件句、宾语从句中时态呼应错误
    examples:
      - wrong: "I have seen the film yesterday."
        right: "I saw the film yesterday."
        note: yesterday 是确定的过去时间状语，只能用一般过去时
      - wrong: "He has gone to Beijing twice last year."
        right: "He went to Beijing twice last year."
    teaching_point: "时间状语决定时态：yesterday/last year/ago 配一般过去时；already/yet/since/for 配现在完成时"
    practice_seed: 3

  - id: B02
    group: B
    name: 被动语态
    name_en: passive voice
    signals:
      - 该用被动语态时误用主动
      - 被动结构形式错误（be 动词缺失、过去分词误写为原形）
      - 无被动标记词 by 但语义上承受者作主语
    examples:
      - wrong: "The house was build in 1990."
        right: "The house was built in 1990."
      - wrong: "English speaks by people all over the world."
        right: "English is spoken by people all over the world."
    teaching_point: "被动语态 = be + 过去分词；主语是动作承受者时必须用被动"
    practice_seed: 3

  - id: B03
    group: B
    name: 情态动词
    name_en: modal verbs
    signals:
      - 情态动词后误接 to
      - 语义强度误用（must/can/may 混淆）
      - 情态动词后未用动词原形
    examples:
      - wrong: "You should to finish your homework first."
        right: "You should finish your homework first."
      - wrong: "He can sings very well."
        right: "He can sing very well."
    teaching_point: "情态动词 + 动词原形，无人称和数的变化；must（必须）/may（可以/或许）语义分级"
    practice_seed: 3

  - id: B04
    group: B
    name: 非谓语动词
    name_en: non-finite verbs
    signals:
      - enjoy/finish/mind/practice 后误接 to do
      - to do 与 doing 混淆
      - 介词后误用动词原形
    examples:
      - wrong: "I enjoy to read novels."
        right: "I enjoy reading novels."
      - wrong: "He is interested in play games."
        right: "He is interested in playing games."
    teaching_point: "接 doing 的常用动词（enjoy/finish/practice/keep/mind/suggest）与接 to do 的动词分类记忆；介词后一律 doing"
    practice_seed: 3

  - id: B05
    group: B
    name: 从句与连接词
    name_en: clauses & connectives
    signals:
      - that/which/who 关系代词误用
      - 宾语从句未用陈述语序
      - 时间/条件状语从句连接词选错
    examples:
      - wrong: "I don't know what does he like."
        right: "I don't know what he likes."
        note: 宾语从句必须用陈述语序
      - wrong: "The book which I borrowed it from the library is interesting."
        right: "The book I borrowed from the library is interesting."
    teaching_point: "宾语从句陈述语序：连接词 + 主语 + 谓语；定语从句中关系代词已充当成分，不可重复"
    practice_seed: 3

  - id: B06
    group: B
    name: 主谓一致与 there be
    name_en: subject-verb agreement & there-be
    signals:
      - 第三人称单数主语缺 -s
      - 集体名词、不定代词与谓语形式不一致
      - there have 类误用与就近原则错误
    examples:
      - wrong: "He like playing basketball."
        right: "He likes playing basketball."
      - wrong: "There have many books on the shelf."
        right: "There are many books on the shelf."
        note: there be 表存在，have 表拥有，二者不可混用
    teaching_point: "先找主语再定谓语：三单加 s；everyone/somebody 等不定代词按三单处理；there be 用就近原则"
    practice_seed: 3

  - id: B07
    group: B
    name: 比较等级
    name_en: comparison
    signals:
      - more + 比较级叠用
      - 形容词与副词混用（修饰动词用了形容词）
      - as...as / than 结构不完整
    examples:
      - wrong: "This book is more better than that one."
        right: "This book is better than that one."
      - wrong: "He runs quick."
        right: "He runs quickly."
        note: 修饰动词 run 要用副词 quickly
    teaching_point: "比较级不再加 more；修饰动词用副词；-ly 变副词规则专项训练"
    practice_seed: 3

  - id: B08
    group: B
    name: 句子成分与语序
    name_en: sentence elements & word order
    signals:
      - 形容词直接作谓语（缺系动词）
      - 频率/程度副词位置错误
      - 疑问句、感叹句语序混乱
    examples:
      - wrong: "He very happy today."
        right: "He is very happy today."
        note: 形容词不能单独作谓语，需加系动词
      - wrong: "I also don't like it."
        right: "I don't like it either."
        note: 否定句'也'用 either 且置于句尾
    teaching_point: "英语句子必须有谓语动词；频率副词在实义动词前、be/情态动词后；特殊句式语序专项梳理"
    practice_seed: 3

  - id: B09
    group: B
    name: 词性误用
    name_en: wrong part of speech
    signals:
      - 该用副词处用了形容词
      - 名词作定语时的单复数误用
      - 动词/名词/形容词混用（care/careful/carefully 类）
    examples:
      - wrong: "We had two sports shoes shops in the town."
        right: "We had two sports shoe shops in the town."
        note: 名词作定语通常用单数
      - wrong: "He studies English careful every day."
        right: "He studies English carefully every day."
    teaching_point: "词性由句法位置决定；修饰动词用副词、修饰名词用形容词；名词作定语用单数"
    practice_seed: 3

  # ================= C 语篇理解类（8）· 阅读 + 完形 =================
  - id: C01
    group: C
    name: 主旨大意误判
    name_en: misjudging the main idea
    signals:
      - 选了细节选项当主旨
      - 以偏概全，用某段内容概括全文
      - 过度概括，超出文本范围
    examples:
      - question: "What is the main idea of the passage?"
        wrong_option: "The writer's father taught him to swim in 2010."
        explanation: "这是第二段的细节，不能概括全文主旨"
      - question: "What's the best title for the passage?"
        wrong_option: "A Sad Story About a Dog"
        explanation: "文章整体基调是温暖励志，标题情感色彩与全文不符——以偏概全"
    teaching_point: "主旨题看全文：首尾段 + 各段首句；正确选项应能覆盖全文而非某一段"
    practice_seed: 3

  - id: C02
    group: C
    name: 细节定位错误
    name_en: wrong detail location
    signals:
      - 定位到错误段落
      - 同义替换未识别（原文 paraphrase 看不出）
      - 张冠李戴，把 A 的特征安到 B 头上
    examples:
      - question: "According to Paragraph 2, when did the museum open?"
        wrong_option: "In 1998."
        explanation: "1998 是第三段提到的图书馆开放时间，定位串段"
      - question: "Which of the following is TRUE about the new bridge?"
        wrong_option: "It is the longest bridge in the world."
        explanation: "原文说 in the city，选项扩大为 in the world——同义替换与范围词未核对"
    teaching_point: "细节题三步：划关键词 → 回文定位 → 逐词比对；警惕范围扩大与偷换主语"
    practice_seed: 3

  - id: C03
    group: C
    name: 推理判断越界
    name_en: over-inference
    signals:
      - 选项内容文本未陈述且无法合理推出
      - 把'可能'表述当作'事实'表述
      - 用生活常识替代文本依据
    examples:
      - question: "What can we learn from the passage?"
        wrong_option: "The writer wants us to stop using phones."
        explanation: "文本仅陈述手机使用现象，未表达该意图——把'可以推断'扩大为'作者主张'"
      - question: "What can we infer about the old man?"
        wrong_option: "He lived a rich life when he was young."
        explanation: "文本未提及过去生活状况，属无依据推断"
    teaching_point: "推断题必须'基于文本、止步文本'：选项每句话都要能在文中找到出处"
    practice_seed: 3

  - id: C04
    group: C
    name: 词义猜测无依据
    name_en: groundless word guessing
    signals:
      - 未利用上下文线索，凭字面或母语直觉选
      - 忽视构词法线索
      - 忽视定义、举例、对比等语境提示
    examples:
      - question: "What does the underlined word 'abandoned' in Paragraph 3 probably mean?"
        wrong_option: "bought（买）"
        explanation: "后文 nobody lived there any more 提示是'废弃的'，凭直觉选了毫不相关的词义"
      - question: "The word 'yield' in the passage is closest in meaning to ____."
        wrong_option: "produce more money"
        explanation: "未利用前文 crops 提示的农业语境，错按金融联想"
    teaching_point: "猜词五线索：定义、举例、对比、因果、构词法——先找线索再选答案"
    practice_seed: 3

  - id: C05
    group: C
    name: 作者态度/意图误读
    name_en: misreading attitude or purpose
    signals:
      - 混淆事实与观点
      - 褒贬判断错误
      - 写作目的题选成文章细节
    examples:
      - question: "What's the writer's attitude towards online shopping?"
        wrong_option: "Indifferent.（漠不关心）"
        explanation: "作者通篇列举利弊并给出建议，态度是客观理性，非漠不关心——褒贬词未识别"
      - question: "Why does the writer write the passage?"
        wrong_option: "To tell us a story about his cousin."
        explanation: "故事只是引入手段，真实目的是倡导垃圾分类——引入与目的混淆"
    teaching_point: "抓态度词（fortunately/unfortunately/should 等）与全文结论句；写作目的看文章落脚点"
    practice_seed: 3

  - id: C06
    group: C
    name: 篇章结构与指代
    name_en: text structure & reference
    signals:
      - 段落关系判断错误（并列误判为因果）
      - 代词指代对象识别错误
      - 句子还原/段落顺序题逻辑链断裂
    examples:
      - question: "What does the underlined word 'They' in Paragraph 4 refer to?"
        wrong_option: "The teachers."
        explanation: "就近原则下 They 指代前一句的 students，指代链断裂"
      - question: "Which of the following shows the structure of the passage?"
        wrong_option: "总-分（P1 中心，P2-P3 并列展开）"
        explanation: "P4 是转折段，实为总-分-转结构，未识别转折词 However 的结构功能"
    teaching_point: "指代看前句最近的复数名词；结构题标出每段功能句与转折词，画段落关系图"
    practice_seed: 3

  - id: C07
    group: C
    name: 完形语境线索缺失
    name_en: missing cloze context clues
    signals:
      - 未利用上下文复现线索（同词/同义词复现）
      - 忽视逻辑连接词提示（however/therefore/because）
      - 忽视情感色彩与叙述一致性
    examples:
      - question: "The old man was very ____. He gave all his money to the poor children."
        wrong_option: "rich（富有）"
        explanation: "后文'把钱都捐给穷孩子'提示是 kind（善良），未利用后文行为线索"
      - question: "I failed the test again. ____, my parents didn't blame me."
        wrong_option: "Because（因为）"
        explanation: "前后句是转折关系（考砸了但没被责怪），应选 However，未识别逻辑关系"
    teaching_point: "完形三步：通读定基调 → 逐空找线索（前句/后句/全段）→ 代入复检逻辑与情感一致"
    practice_seed: 3

  - id: C08
    group: C
    name: 信息转述与整合
    name_en: paraphrasing & information integration
    signals:
      - 任务型阅读/表格填空照抄原文而非转述
      - 多段信息整合遗漏或错误
      - 词数限制下未提炼要点（任务型阅读限词作答）
    examples:
      - question: "What did the writer do after school?（限 10 词作答）"
        wrong_option: "He played basketball with his friends in the park near his school after school every day last year."
        explanation: "照抄原文超限且未提炼，应转述为 He played basketball with his friends."
      - question: "Fill in the blanks: The boy felt ____ when he got the gift."
        wrong_option: "happy and excited（照抄原句整段）"
        explanation: "表格填空要求关键词，未从多个句子中提炼核心信息"
    teaching_point: "信息转述 = 定位原文 → 提炼要点 → 按限词改写；表格题先读表格结构再回文找对应"
    practice_seed: 3

  # ================= D 书面表达类（8） =================
  - id: D01
    group: D
    name: 内容要点缺失
    name_en: missing key points
    signals:
      - 书面表达漏掉题目给出的要点
      - 题目要求的内容只覆盖一部分
      - 图表类作文信息点缺失
    examples:
      - wrong: "题目要求介绍活动时间、地点、内容三要点，作文只写了时间和内容"
        right: "逐要点核对：时间√ 地点√ 内容√"
        note: 书面表达先保"要点齐全"，再求语言质量
      - wrong: "题目要求给笔友写回信并回答三个问题，作文只回答了第一个问题"
        right: "按来信问题逐一回应：问题一√ 问题二√ 问题三√"
        note: 题干中的问题、图表信息点都是评分必查项，漏一项即扣要点分
    teaching_point: "动笔前列要点清单，写完逐条打钩——'要点齐全'是书面表达第一评分线"
    practice_seed: 0

  - id: D02
    group: D
    name: 文体与格式错误
    name_en: wrong genre or format
    signals:
      - 把'写信'写成'写短文'
      - 书信/通知/演讲稿格式要素缺失（称呼、落款、日期）
      - 文体语气与题材不符
    examples:
      - wrong: "题目要求写一封邀请信，学生写成了通知（Notice）"
        right: "邀请信：称呼 + 开头邀请 + 活动信息 + 期待回复 + 落款"
      - wrong: "演讲稿开头：Dear teachers and students, I'm writing to tell you..."
        right: "演讲稿：Good morning, everyone! Today I want to talk about..."
        note: 演讲稿是口头表达文体，不应使用书信式开头
    teaching_point: "圈画题目中的文体动词（write a letter / give a speech）；按文体套用格式骨架"
    practice_seed: 0

  - id: D03
    group: D
    name: 人称与时态不符
    name_en: inconsistent person or tense
    signals:
      - 题目要求第一人称却通篇用第三人称
      - 人称中途无故切换
      - 题目要求写过去经历却用一般现在时
    examples:
      - wrong: "题目：以你的名义写一封信介绍你的暑假。作文开头：Li Ming spent his summer holiday..."
        right: "I spent my summer holiday..."
        note: 人称与题目设定不一致，把"我"写成了"他"
      - wrong: "题目：Write about your last weekend. 开头：I get up at seven..."
        right: "I got up at seven..."
        note: 写过去经历却通篇用一般现在时，时态未跟随题目时间设定
    teaching_point: "审题先定人称与时态：圈出题目人称要求与时间设定；写完通读查一致性"
    practice_seed: 0

  - id: D04
    group: D
    name: 中式英语表达
    name_en: Chinglish expression
    signals:
      - open the light / play the phone 等按中文语序逐字直译
      - I very like... 副词位置按中文直译
      - return back 类同义叠用、主语重复
    examples:
      - wrong: "Please open the light."
        right: "Please turn on the light."
        note: 中文'开灯'直译为 open，英语固定搭配是 turn on
      - wrong: "I very like English."
        right: "I like English very much."
        note: very 不能直接修饰动词，程度状语后置
      - wrong: "He returned back home at six."
        right: "He returned home at six."
        note: return 本身含'回'义，back 冗余
    teaching_point: "建立语块意识：以 turn on / be interested in 等整体语块为单位记忆，而非逐字组装"
    practice_seed: 3

  - id: D05
    group: D
    name: 衔接与连贯缺失
    name_en: weak cohesion & coherence
    signals:
      - 逻辑连接词缺失或误用
      - although 与 but 连用
      - because 与 so 连用；段落间无过渡
    examples:
      - wrong: "Although it was raining, but we went out."
        right: "Although it was raining, we went out."
        note: 英语中 although 与 but 只能取其一
      - wrong: "Because I was ill, so I stayed at home."
        right: "I was ill, so I stayed at home."
    teaching_point: "汉语'虽然……但是'成对，英语连词单用；写段落先列逻辑链再选连接词"
    practice_seed: 3

  - id: D06
    group: D
    name: 语用不得体
    name_en: pragmatic inappropriateness
    signals:
      - 请求/建议/道歉的语气与句式不合语境
      - 对长辈或陌生人使用命令句
      - 忽视英语文化中的礼貌策略
    examples:
      - wrong: "You must help me with my English."
        right: "Could you please help me with my English?"
        note: 向他人请求应用 Could you please... 委婉句式
      - wrong: "I want you to check my composition."
        right: "Would you mind checking my composition?"
    teaching_point: "请求用 Could/Would you...；建议用 You'd better / Why not...；语气委婉度随对象与场合调整"
    practice_seed: 0

  - id: D07
    group: D
    name: 字数不足或超限
    name_en: word count violation
    signals:
      - 字数明显低于题目要求（通常低于 80%）
      - 严重超限（超 150%）
      - 为凑字数重复堆砌
    examples:
      - wrong: "要求 80 词左右，实际仅写 45 词"
        right: "按三段式展开：开头 15 + 主体 50 + 结尾 15"
        note: 字数不足 80% 直接失分，平时按段落配额练字数
      - wrong: "要求 60 词左右，实际写了 120 词且后半部分重复堆砌"
        right: "删繁就简：每个要点 2-3 句，紧扣主题不跑偏"
        note: 严重超限同样扣分，堆砌重复句不能换取要点分
    teaching_point: "平时训练数字数；按要点分配段落篇幅，避免头重脚轻"
    practice_seed: 0

  - id: D08
    group: D
    name: 卷面与书写规范
    name_en: handwriting & presentation
    signals:
      - 字迹潦草影响辨认
      - 涂改过多
      - 标点缺失或中英文标点混用
    examples:
      - wrong: "使用中文逗号'，'与句号'。'；单词间无空格"
        right: "英文标点 + 单词间空格 + 大小写规范"
        note: 中英文标点混用与无空格书写影响卷面辨认
      - wrong: "书面表达通篇小写，句首与专有名词均未大写"
        right: "句首大写、I 永远大写、专有名词首字母大写"
        note: 大小写与书写规范是卷面分的基础项
    teaching_point: "誊写规范：英文标点、单词间距、句首大写；养成打草稿再誊写的习惯"
    practice_seed: 0

  # ================= E 答题行为类（5）· 粗心 vs 未掌握自动判别 =================
  - id: E01
    group: E
    name: 审题偏差
    name_en: misreading the task
    signals:
      - 未看清题目限定条件（如'用所给词的适当形式'）
      - 答题格式不合要求（如要求填序号却写单词）
      - 忽略题目中的否定词/限定词
    examples:
      - scenario: "题目要求'用所给词的适当形式填空'，学生直接抄原词未变形"
        judgement: "审题偏差：不是知识问题，是未读清作答指令"
    rule:
      all_of:
        - "task_requirement_misread == true"
    teaching_point: "作答前划出指令词（用适当形式/填序号/不少于X词）与限定词；答案与指令逐条对照"
    practice_seed: 0

  - id: E02
    group: E
    name: 粗心性失误
    name_en: careless slip
    signals:
      - 该生该错因历史上仅出现 1 次
      - 该题班级正确率高（多数同学做对）
      - 该生其他同类题作答正确
    rule:
      all_of:
        - "student_cat_count == 1"
        - "class_correct_rate >= 0.70"
        - "student_other_similar_correct == true"
    contrast_with: E05
    examples:
      - scenario: "S05 只在一次单项选择中错冠词，班级正确率 85%，其作文中冠词全部正确"
        judgement: "判定为粗心性失误：不是知识缺陷，是临场疏忽"
    teaching_point: "习惯训练而非重讲知识：圈关键词、完成后回读检查"
    practice_seed: 0

  - id: E03
    group: E
    name: 检查缺失
    name_en: lack of review
    signals:
      - 同一篇作答中自相矛盾（人称/时态前后不一致）
      - 誊写漏行、涂改后未理顺
      - 出现明显低级错误且未自查修正
    examples:
      - scenario: "同一篇作文前三段用 I，最后一段突然变成 He；草稿正确誊写抄错"
        judgement: "检查缺失：知识在、习惯缺"
    rule:
      all_of:
        - "self_contradiction_found == true"
    teaching_point: "教检查清单：人称一致性、时态一致性、单复数三查；留 5 分钟终检"
    practice_seed: 0

  - id: E04
    group: E
    name: 空白未答
    name_en: blank / no response
    signals:
      - 作答为空或仅有抄题痕迹
      - 明显未完成该题
    examples:
      - scenario: "书面表达只写了开头一句；单选题连续 5 题未涂卡"
        judgement: "空白未答：需区分时间不够与不会做"
    rule:
      all_of:
        - "answer_is_blank == true"
    teaching_point: "访谈确认原因：时间管理问题训练做题节奏；畏难情绪进行低起点补偿"
    practice_seed: 0

  - id: E05
    group: E
    name: 知识未掌握
    name_en: knowledge not mastered
    signals:
      - 同一错因反复出现（≥3 次）
      - 该题班级正确率低（<50%）且该生错误
    rule:
      any_of:
        - "student_cat_count >= 3"
        - "class_correct_rate < 0.50"
    contrast_with: E02
    examples:
      - scenario: "S07 本学期 4 次作业都在'现在完成时 vs 一般过去时'上出错"
        judgement: "知识未掌握：需要重讲 + 补偿练习 + 个别辅导"
    teaching_point: "需要重讲并配补偿练习，列入个别辅导名单——这是讲评课优先级最高的信号"
    practice_seed: 0
